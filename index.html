<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#09070b" />
    <meta name="description" content="A little Halloween surprise is waiting for you." />
    <meta property="og:title" content="A Halloween Surprise" />
    <meta property="og:description" content="You found something strange. Tap to reveal it." />
    <meta property="og:image" content="https://github.com/TommyLee1208/TK-image/blob/main/main172addad569744ceb0c765e8ff0fbbab.png?raw=true" />
    <title>A Halloween Surprise</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="experience" id="experience">
      <section class="curtain" id="curtain" aria-labelledby="surpriseTitle">
        <div class="moon" aria-hidden="true"></div>
        <div class="fog fog-one" aria-hidden="true"></div>
        <div class="fog fog-two" aria-hidden="true"></div>

        <div class="curtain-copy">
          <p class="kicker">YOU FOUND IT</p>
          <h1 id="surpriseTitle">Something strange<br />is waiting.</h1>
          <button class="reveal-button" id="revealButton" type="button">
            <span class="button-icon" aria-hidden="true">✦</span>
            Tap to reveal
          </button>
          <p class="sound-note">Best experienced with sound on</p>
        </div>
      </section>

      <section class="reveal" id="reveal" aria-label="Halloween surprise" aria-hidden="true">
        <figure class="poster-frame">
          <img
            class="poster"
            src="https://github.com/TommyLee1208/TK-image/blob/main/main172addad569744ceb0c765e8ff0fbbab.png?raw=true"
            alt="Halloween prank poster"
          />
          <div class="poster-shade" aria-hidden="true"></div>
        </figure>

        <div class="afterglow">
          <p class="found-copy">You survived the surprise.</p>
          <a
            class="secret-link"
            href="https://shop.tiktok.com/us/pdp/1732556142806536836?source=ecommerce_store&amp;enter_method=feed_list_store_list_product&amp;first_entrance=ecommerce_store&amp;first_entrance_tt_scene=seo"
            target="_blank"
            rel="noopener noreferrer"
          >
            See what caused it <span aria-hidden="true">↗</span>
          </a>
        </div>
      </section>
    </main>

    <noscript>
      <p class="no-script">Please enable JavaScript to reveal your Halloween surprise.</p>
    </noscript>
    <script src="script.js"></script>
  </body>
</html>
